plugins { id 'com.android.application' }

android {
    namespace 'com.quantumooze.slot'
    compileSdk 37

    defaultConfig {
        applicationId 'com.quantumooze.slot'
        minSdk 23
        targetSdk 35
        versionCode 12
        versionName '1.6.5'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
